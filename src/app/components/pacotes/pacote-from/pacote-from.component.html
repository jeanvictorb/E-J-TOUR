<div class="packages-wrapper">
  
  <!-- Cabeçalho da Seção -->
  <div class="packages-header">
    <h1>Nossos Pacotes</h1>
    <p>
      Escolha o pacote perfeito para sua aventura em Foz do Iguaçu. 
      Experiências inesquecíveis esperando por você!
    </p>
  </div>

  <!-- Filtros de Categoria (Opcional) -->
  <!-- Descomente se quiser adicionar filtros
  <div class="packages-filters">
    <button class="filter-btn active">Todos</button>
    <button class="filter-btn">Aventura</button>
    <button class="filter-btn">Família</button>
    <button class="filter-btn">Romântico</button>
    <button class="filter-btn">Cultural</button>
  </div>
  -->

  <!-- Grid de Pacotes -->
  <div class="cardspackage">
    <ng-container *ngFor="let card of cardpackage; let i = index">
      <app-card
        [titulo]="card.titulo"
        [descricao]="card.descricao"
        [atividades]="card.atividades.join(', ')"
        [imagem]="card.imagem"
      >
        <!-- Badge opcional - descomente para usar -->
        <!-- 
        <div class="package-badge" *ngIf="i === 0">Novo</div>
        <div class="package-badge popular" *ngIf="i === 1">Popular</div>
        -->
      </app-card>
    </ng-container>
  </div>

  <!-- CTA (Call to Action) -->
  <div class="packages-cta">
    <h2>Não encontrou o pacote ideal?</h2>
    <p>
      Entre em contato conosco e monte um roteiro personalizado 
      para sua viagem dos sonhos!
    </p>
    <a 
      href="https://api.whatsapp.com/send?phone=5545999492697&text=Olá,%20gostaria%20de%20montar%20um%20pacote%20personalizado"
      target="_blank"
      rel="noopener noreferrer"
      class="cta-button"
    >
      <i class="fab fa-whatsapp"></i>
      Fale Conosco
    </a>
  </div>

</div>
