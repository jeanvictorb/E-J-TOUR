<div class="feedback-form-container">
  <h2>Deixe seu Feedback</h2>
  <p class="subtitle">Sua opinião é muito importante para nós! ✨</p>

  <!-- Campo de Nome -->
  <input 
    [(ngModel)]="nameComment" 
    placeholder="Seu nome" 
    type="text"
    maxlength="50"
  />

  <!-- Campo de Feedback -->
  <textarea 
    [(ngModel)]="text" 
    placeholder="Conte-nos sobre sua experiência..."
    maxlength="500"
  ></textarea>

  <!-- Contador de caracteres (opcional) -->
  <div class="char-counter" *ngIf="text.length > 0">
    {{ text.length }}/500 caracteres
  </div>

  <!-- Sistema de Avaliação -->
  <div class="rating-stars">
    <span 
      class="star" 
      *ngFor="let star of [1, 2, 3, 4, 5]"
      [class.filled]="(hoverRating || rating) >= star" 
      (mouseenter)="setHover(star)"
      (mouseleave)="clearHover()" 
      (click)="setRating(star)"
    >
      ★
    </span>
  </div>

  <!-- Botão de Enviar -->
  <button 
    (click)="addComment()"
    [disabled]="!nameComment || !text || rating === 0"
  >
    Enviar Feedback
  </button>

  <!-- Mensagem de ajuda -->
  <p class="help-text">
    Por favor, avalie sua experiência com as estrelas acima
  </p>
</div>
