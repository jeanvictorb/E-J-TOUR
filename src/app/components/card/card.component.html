<div class="card">
  <img [src]="imagem" class="card-img-top" alt="{{ titulo }}" />
  <div class="card-body">
    <h6 class="card-title">{{ titulo }}</h6>
    <p class="card-text">{{ descricao }}</p>

    <div class="whats-button">
      <a [href]="whatsappUrl" target="_blank" rel="noopener noreferrer" class="whats-button">
        <span class="text">Quero saber mais</span>
      </a>
    </div>

  </div>
</div>
